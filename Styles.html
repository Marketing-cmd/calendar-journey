<style>
  :root {
    --bg:#f2f6fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#dbe4ef; --brand:#0f766e; --accent:#c2410c; --danger:#b42318;
    --ok:#1d6f42; --font:"Plus Jakarta Sans","Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font); color:var(--ink);
    background: radial-gradient(circle at 10% 0%,#d9f3ec 0,transparent 40%),
                radial-gradient(circle at 100% 0%,#fce8d9 0,transparent 40%), var(--bg); }
  .wrap { max-width:1400px; margin:0 auto; padding:20px; }
  .hero { background:linear-gradient(125deg,#0f766e,#0b556d); color:#fff; border-radius:16px;
    padding:20px; margin-bottom:16px; box-shadow:0 10px 24px rgba(6,51,65,.28); animation:fadein .45s ease-out; }
  .hero h1 { margin:0 0 8px; font-size:28px; }
  .hero p  { margin:0; opacity:.95; }
  .grid-main { display:grid; grid-template-columns:350px 1fr; gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px; box-shadow:0 4px 12px rgba(20,42,70,.05); animation:rise .35s ease-out; }
  h2 { margin:2px 0 12px; font-size:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:10px; }
  input,select,textarea,button { width:100%; padding:10px 11px; border-radius:8px;
    border:1px solid #c9d7e6; font-family:inherit; font-size:14px; }
  textarea { resize:vertical; min-height:100px; }
  button { cursor:pointer; font-weight:600; color:#fff; background:var(--brand); border-color:transparent; }
  button:hover { filter:brightness(.96); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.danger { background:var(--danger); }
  button.warn   { background:#d97706; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .actions button { flex:1; }
  .template-list { max-height:300px; overflow:auto; display:grid; gap:8px; }
  .template-item { text-align:left; color:var(--ink); background:#f8fbff; border:1px solid var(--line); }
  .template-item.sel { border-color:var(--brand); background:#eefaf7; }
  .template-title { font-weight:700; font-size:14px; }
  .template-meta  { font-size:12px; color:var(--muted); margin-top:3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .preview-shell { border:1px dashed #c9d7e6; border-radius:10px; padding:10px; background:#fbfdff; }
  .preview-subject { font-weight:700; margin-bottom:8px; }
  .color-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
  .color-card { border:1px solid var(--line); border-radius:10px; padding:10px;
    display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:start; background:#fcfdff; }
  .swatch { width:38px; height:38px; border-radius:8px; border:1px solid rgba(0,0,0,.1); }
  .swatch-title { font-size:13px; font-weight:700; }
  .swatch-sub   { font-size:12px; color:var(--muted); margin-bottom:6px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { border:1px solid var(--line); padding:7px; text-align:left; vertical-align:top; }
  thead { background:#f3f8ff; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; }
  .toolbar button { width:auto; }
  .empty { color:var(--muted); font-size:13px; padding:8px 2px; }
  .toast { position:fixed; right:18px; bottom:18px; padding:10px 12px; border-radius:8px;
    color:#fff; opacity:0; transform:translateY(10px); transition:.22s; pointer-events:none; font-size:13px; }
  .toast.ok   { background:var(--ok); }
  .toast.err  { background:var(--danger); }
  .toast.show { opacity:1; transform:translateY(0); }

  /* ── Status Badges ── */
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.3px; }
  .badge-pending   { background:#e5e7eb; color:#374151; }
  .badge-active    { background:#d1fae5; color:#065f46; }
  .badge-paused    { background:#fef3c7; color:#92400e; }
  .badge-cancelled { background:#fee2e2; color:#991b1b; }
  .badge-completed { background:#dbeafe; color:#1e40af; }
  .badge-switching { background:#ffedd5; color:#9a3412; }

  /* ── Journey Manager ── */
  .grid-journey-manager { display:grid; grid-template-columns:240px 1fr; gap:16px; }
  .journey-list { display:grid; gap:8px; max-height:420px; overflow:auto; }
  .journey-item { text-align:left; padding:10px; background:#f8fbff;
    border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .journey-item.sel { border-color:var(--brand); background:#eefaf7; }
  .journey-item-name { font-weight:700; font-size:14px; }
  .journey-item-meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .journey-step-block { border:1px solid var(--line); border-radius:8px;
    padding:10px; margin-bottom:8px; background:#fafcff; }
  .journey-step-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }

  /* ── Customer Cards ── */
  .customer-state-card { border:1px solid var(--line); border-radius:10px;
    padding:12px; margin-bottom:10px; background:#fcfdff; }
  .customer-state-header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .state-controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .state-controls button { width:auto; font-size:13px; padding:7px 12px; }

  @keyframes fadein { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
  @keyframes rise   { from{opacity:0;transform:translateY(8px)}  to{opacity:1;transform:none} }
  @media(max-width:980px){
    .grid-main { grid-template-columns:1fr; }
    .grid4     { grid-template-columns:1fr 1fr; }
    .grid-journey-manager { grid-template-columns:1fr; }
  }

  /* ── New section styles (appended — do not touch above) ── */

  /* Left-nav shell */
  .app-shell { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  .side-nav  { background:#0f766e; color:#fff; padding:0; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .side-nav .nav-logo { padding:18px 16px 10px; font-size:17px; font-weight:800; border-bottom:1px solid rgba(255,255,255,.15); }
  .side-nav .nav-item { display:block; width:100%; text-align:left; padding:11px 16px; border:none;
    background:none; color:rgba(255,255,255,.85); cursor:pointer; font-size:13px; font-weight:600;
    border-left:3px solid transparent; transition:.15s; }
  .side-nav .nav-item:hover  { background:rgba(255,255,255,.08); color:#fff; }
  .side-nav .nav-item.active { background:rgba(255,255,255,.14); color:#fff; border-left-color:#fff; }
  .main-content { padding:20px; overflow-y:auto; }
  .section-view { display:none; }
  .section-view.visible { display:block; }

  /* Page header */
  .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .page-header h2 { margin:0; font-size:22px; }

  /* Candidates */
  .candidate-card { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#fffdf5; }
  .candidate-header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .candidate-title  { font-weight:700; font-size:14px; }
  .candidate-meta   { font-size:12px; color:var(--muted); }
  .candidate-emails { font-size:12px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:6px; padding:6px 10px; margin:6px 0; }
  .candidate-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .candidate-actions button { width:auto; font-size:13px; padding:6px 12px; }

  /* SMS Templates */
  .sms-template-list { max-height:320px; overflow:auto; display:grid; gap:8px; }
  .sms-template-item { text-align:left; color:var(--ink); background:#f8fbff; border:1px solid var(--line);
    border-radius:8px; padding:10px; cursor:pointer; }
  .sms-template-item.sel  { border-color:var(--brand); background:#eefaf7; }
  .sms-char-counter { font-size:11px; color:var(--muted); text-align:right; margin-top:3px; }
  .sms-char-warn    { color:#d97706; }
  .sms-char-over    { color:var(--danger); }

  /* Delivery Logs */
  .delivery-badge            { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; }
  .delivery-badge-sent       { background:#d1fae5; color:#065f46; }
  .delivery-badge-pending_retry { background:#fef3c7; color:#92400e; }
  .delivery-badge-failed     { background:#fee2e2; color:#991b1b; }
  .delivery-badge-pending    { background:#e5e7eb; color:#374151; }

  /* Calendar scan section */
  .scan-window-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .scan-window-tabs button { width:auto; background:#e5e7eb; color:var(--ink); border-color:#d1d5db; }
  .scan-window-tabs button.active { background:var(--brand); color:#fff; border-color:transparent; }
  .scan-event-card { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px;
    display:grid; grid-template-columns:38px 1fr auto; gap:10px; align-items:start; background:#fcfdff; }
  .scan-swatch { width:30px; height:30px; border-radius:6px; border:1px solid rgba(0,0,0,.1); margin-top:2px; }
  .scan-event-title { font-weight:700; font-size:13px; }
  .scan-event-meta  { font-size:12px; color:var(--muted); }
  .scan-event-badge { font-size:11px; }

  /* Settings extended */
  .settings-section-title { font-size:13px; font-weight:700; color:var(--brand); margin:16px 0 8px;
    padding-bottom:4px; border-bottom:1px solid var(--line); }

  @media(max-width:760px){
    .app-shell { grid-template-columns:1fr; }
    .side-nav  { position:static; height:auto; }
  }
</style>
